<!DOCTYPE html>
<html>
<head>
    <title>Heart Disease Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="main-container">
    <h1>Heart Disease Prediction</h1>
    <p class="subtitle">
        Fill the following details to predict if a person is likely to have heart disease.
    </p>

    <form action="/predict" method="post">

    <label>Age</label>
    <input type="number" name="age" required>

    <label>Sex (0 = Female, 1 = Male)</label>
    <input type="number" name="sex" min="0" max="1" required>

    <label>Chest Pain Type (0–3)</label>
    <input type="number" name="cp" min="0" max="3" required>

    <label>Resting Blood Pressure (trestbps)</label>
    <input type="number" name="trestbps" required>

    <label>Cholesterol (chol)</label>
    <input type="number" name="chol" required>

    <label>Fasting Blood Sugar (0 = No, 1 = Yes)</label>
    <input type="number" name="fbs" min="0" max="1" required>

    <label>Rest ECG (0–2)</label>
    <input type="number" name="restecg" min="0" max="2" required>

    <label>Max Heart Rate (thalach)</label>
    <input type="number" name="thalach" required>

    <label>Exercise Induced Angina (0 = No, 1 = Yes)</label>
    <input type="number" name="exang" min="0" max="1" required>

    <label>Oldpeak</label>
    <input type="number" step="any" name="oldpeak" required>

    <label>Slope (0–2)</label>
    <input type="number" name="slope" min="0" max="2" required>

    <label>CA (0–3)</label>
    <input type="number" name="ca" min="0" max="3" required>

    <label>Thal (1–3)</label>
    <input type="number" name="thal" min="1" max="3" required>

    <button type="submit">Predict</button>

</form>
</div>

</body>
</html>
